name: Deploy Bike Survey AI to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Generate config.js from GitHub Secrets
        env:
          KEY1: ${{ secrets.GEMINI_API_KEY }}
          KEY2: ${{ secrets.GEMINI_API_KEY_BIKE_SURVEY_WEB }}
          KEY3: ${{ secrets['GEMINI_API_KEY_bike-survey-web'] }}
        run: |
          API_KEY="${KEY1:-${KEY2:-$KEY3}}"
          if [ -n "$API_KEY" ]; then
            echo "const CONFIG = { GEMINI_API_KEY: \"$API_KEY\" };" > config.js
            echo "✓ GitHub SecretからAPIキーを自動注入しました"
          elif [ ! -f config.js ]; then
            echo "const CONFIG = { GEMINI_API_KEY: \"\" };" > config.js
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
